name: Sandbox Auto Creation and Deletion

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform plan and apply
        run: echo Terraform plan and apply
      - name: Create VPC and VM or services needed for sandbox
        run: |
          echo Create VPC and VM or services needed for sandbox
      - name: Start Timer for 10 Sec
        run: sleep 10
      - name: after timer ends terraform destroys sandbox
        run: echo terraform destroy
      
